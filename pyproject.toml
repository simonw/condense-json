[project]
name = "condense-json"
version = "1.1"
description = "Python function for condensing JSON using replacement strings"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Simon Willison"}]
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Typing :: Typed"
]
dependencies = []

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project.urls]
Homepage = "https://github.com/simonw/condense-json"
Changelog = "https://github.com/simonw/condense-json/releases"
Issues = "https://github.com/simonw/condense-json/issues"
CI = "https://github.com/simonw/condense-json/actions"


[dependency-groups]
dev = ["pytest", "mypy", "hypothesis"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
